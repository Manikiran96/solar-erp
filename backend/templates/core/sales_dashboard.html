{% extends "base.html" %}

{% block content %}

<h2>Sales Dashboard</h2>

<p class="text-muted">
    Sales and marketing team dashboard.
</p>

<div class="row">

    <div class="col-md-3">
        <div class="card card-box">
            <div class="card-body">
                <h5>Total Leads</h5>
                <h3 id="total_leads">-</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-box">
            <div class="card-body">
                <h5>Won Leads</h5>
                <h3 id="won_leads">-</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-box">
            <div class="card-body">
                <h5>Lost Leads</h5>
                <h3 id="lost_leads">-</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-box">
            <div class="card-body">
                <h5>New Leads</h5>
                <h3 id="new_leads">-</h3>
            </div>
        </div>
    </div>

</div>

<div class="mt-4">

    /api/crm/leads/
        Manage Leads
    </a>

    /api/quotation/quotations/
        Manage Quotations
    </a>

    /api/reports/sales-dashboard/
        View Sales API
    </a>

</div>

<script>
fetch("/api/reports/sales-dashboard/")
    .then(response => response.json())
    .then(data => {
        document.getElementById("total_leads").innerText = data.total_leads ?? 0;
        document.getElementById("won_leads").innerText = data.won_leads ?? 0;
        document.getElementById("lost_leads").innerText = data.lost_leads ?? 0;
        document.getElementById("new_leads").innerText = data.new_leads ?? 0;
    })
    .catch(error => {
        console.log("Sales dashboard API error", error);
    });
</script>

{% endblock %}
