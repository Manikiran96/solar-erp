<!DOCTYPE html>
<html>
<head>
    <title>Solar ERP Login</title>

    https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css

    <style>
        body {
            background-color: #f4f6f9;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="login-box">

    <h3 class="text-center mb-4">
        Solar ERP Login
    </h3>

    {% if error_message %}
        <div class="alert alert-danger">
            {{ error_message }}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label>Username</label>
            <input
                type="text"
                name="username"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                required
            >
        </div>

        <button class="btn btn-primary w-100" type="submit">
            Login
        </button>
    </form>

</div>

</body>
</html>
